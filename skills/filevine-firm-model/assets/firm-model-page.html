<title>Filevine Models</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column of reference tables, with the case lifecycle drawn as a wrapping row of steps. */
:root {
  --bg: #f5f7f8;
  --panel: #ffffff;
  --fg: #1c2530;
  --muted: #586572;
  --line: #dbe1e6;
  --accent: #1d5e78;
  --accent-soft: #e2eef3;
  --money: #7d5200;
  --money-soft: #fbf0d6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --panel: #192027; --fg: #e5eaee; --muted: #98a5b0; --line: #2a343d;
    --accent: #7dc1dd; --accent-soft: #1b3441; --money: #e4b65e; --money-soft: #342a10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --panel: #192027; --fg: #e5eaee; --muted: #98a5b0; --line: #2a343d;
  --accent: #7dc1dd; --accent-soft: #1b3441; --money: #e4b65e; --money-soft: #342a10;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.55 var(--font-body);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 62rem; margin: 0 auto; display: grid; gap: 36px; }
h1 { font-size: 1.75rem; line-height: 1.2; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
h3 { font-size: 0.9375rem; font-weight: 600; margin: 14px 0 0; }
.org { display: grid; gap: 36px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.org:last-child { border-bottom: 0; }
h2 { font-size: 1.0625rem; font-weight: 600; margin: 0 0 4px; }
.lede, .note { color: var(--muted); margin: 0; max-width: 65ch; }
.note { font-size: 0.875rem; margin-top: 6px; }
.meta { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); margin: 0 0 10px; }
section { min-width: 0; }
.scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.8125rem; }
.dim { color: var(--muted); }
.kind { font-size: 0.8125rem; color: var(--muted); }
.kind.is-collection { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--font-mono); font-size: 0.75rem; padding: 1px 7px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.money { background: var(--money-soft); color: var(--money); }
.steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 8px; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.step.is-permanent { border-style: dashed; background: transparent; }
.step .n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.step .name { font-weight: 500; overflow-wrap: anywhere; }
.step .count { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.step .count b { font-weight: 600; color: var(--accent); }
ul.gaps { margin: 10px 0 0; padding-left: 1.1rem; max-width: 65ch; }
ul.gaps li { margin-bottom: 4px; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 6px; padding: 20px; color: var(--muted); max-width: 65ch; }
@media (prefers-reduced-motion: no-preference) { .step { transition: border-color 0.15s; } .step:hover { border-color: var(--accent); } }
</style>

<main id="app">
  <div class="empty" id="empty">No firm model saved yet. Ask Claude to read this firm's Filevine setup and save it here, and the project types, phases and sections will appear on this page.</div>
</main>

<script>
(function () {
  var app = document.getElementById('app');
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function section(title, note) {
    var s = el('section');
    s.append(el('h2', '', title));
    if (note) s.append(el('p', 'note', note));
    return s;
  }
  function table(cols, rows) {
    var wrap = el('div', 'scroll');
    var t = el('table');
    var head = el('tr');
    cols.forEach(function (c) { head.append(el('th', c.num ? 'num' : '', c.label)); });
    var thead = el('thead'); thead.append(head); t.append(thead);
    var tb = el('tbody');
    rows.forEach(function (r) { tb.append(r); });
    t.append(tb); wrap.append(t);
    return wrap;
  }
  function row(cells) {
    var tr = el('tr');
    cells.forEach(function (c) {
      var td = el('td', c.cls || '');
      if (c.node) td.append(c.node); else td.textContent = c.text == null ? '' : String(c.text);
      tr.append(td);
    });
    return tr;
  }
  function sum(list, key) { return list.reduce(function (a, x) { return a + (x[key] || 0); }, 0); }

  function byPrefix(docs, prefix) {
    return Object.keys(docs).filter(function (k) { return k.indexOf(prefix) === 0; }).map(function (k) { return docs[k]; });
  }

  function renderType(t) {
    var wrap = el('div');
    if (t.phases && t.phases.length) {
      var list = el('ol', 'steps');
      var flow = t.phases.filter(function (p) { return !p.permanent; }).sort(function (a, b) { return a.position - b.position; });
      var fixed = t.phases.filter(function (p) { return p.permanent; });
      flow.concat(fixed).forEach(function (p, i) {
        var li = el('li', 'step' + (p.permanent ? ' is-permanent' : ''));
        li.append(el('div', 'n', p.permanent ? 'permanent' : 'step ' + (i + 1)));
        li.append(el('div', 'name', p.name));
        var c = el('div', 'count');
        c.append(el('b', '', String(p.open || 0)), document.createTextNode(' open'));
        li.append(c);
        list.append(li);
      });
      wrap.append(list);
    }
    if (t.sections && t.sections.length) {
      var money = t.sections.map(function (s) { return { name: s.name, n: (s.types && s.types.Currency) || 0 }; }).filter(function (m) { return m.n > 0; });
      if (money.length) wrap.append(el('p', 'note', 'Currency fields: ' + money.map(function (m) { return m.name + ' (' + m.n + ')'; }).join(', ') + '.'));
      wrap.append(table(
        [{ label: 'Section' }, { label: 'Selector' }, { label: 'Kind' }, { label: 'Fields', num: true }, { label: 'Field types' }],
        t.sections.map(function (s) {
          var chips = el('div', 'chips');
          Object.keys(s.types || {}).sort(function (a, b) { return s.types[b] - s.types[a]; }).forEach(function (k) {
            chips.append(el('span', 'chip' + (k === 'Currency' ? ' money' : ''), k + ' ' + s.types[k]));
          });
          var none = !s.fieldCount;
          return row([
            { text: s.name }, { text: s.selector, cls: 'mono' },
            { text: s.kind === 'collection' ? 'Collection' : 'Form', cls: 'kind' + (s.kind === 'collection' ? ' is-collection' : '') },
            { text: none ? 'none listed' : s.fieldCount, cls: 'num' + (none ? ' dim' : '') },
            { node: chips }
          ]);
        })
      ));
    }
    return wrap;
  }

  function renderOrg(o, docs) {
    var box = el('div', 'org');
    var head = el('header');
    head.append(el('p', 'meta', 'Filevine org ' + o.orgId + ' \u00b7 read ' + o.asOf));
    head.append(el('h1', '', (o.firm || 'Firm') + ' Filevine model'));
    var types = byPrefix(docs, 'type_' + o.orgId + '_');
    var open = sum(types, 'open'), archived = sum(types, 'archived');
    head.append(el('p', 'lede', open + ' open and ' + archived + ' archived cases across ' + types.length + ' project types. ' + (o.note || '')));
    box.append(head);

    if (types.length) {
      var s1 = section('Project types');
      var sorted = types.slice().sort(function (a, b) { return ((b.open || 0) + (b.archived || 0)) - ((a.open || 0) + (a.archived || 0)) || String(a.name).localeCompare(String(b.name)); });
      s1.append(table(
        [{ label: 'Type' }, { label: 'ID', num: true }, { label: 'Open', num: true }, { label: 'Archived', num: true }],
        sorted.map(function (t) { return row([{ text: t.name }, { text: t.id, cls: 'num mono' }, { text: t.open || 0, cls: 'num' }, { text: t.archived || 0, cls: 'num' }]); })
      ));
      box.append(s1);
      sorted.forEach(function (t) {
        if ((t.phases && t.phases.length) || (t.sections && t.sections.length)) {
          var st = section(t.name + ' lifecycle and sections', t.note);
          st.append(renderType(t));
          box.append(st);
        }
      });
    }

    var learned = docs['learned_' + o.orgId];
    if (learned && learned.items && learned.items.length) {
      var s6 = section('What we have learned', 'Added as work uses it, in this firm\u2019s own words.');
      s6.append(table(
        [{ label: 'Meaning' }, { label: 'Where' }, { label: 'Learned' }],
        learned.items.map(function (x) { return row([{ text: x.meaning }, { text: x.where, cls: 'mono' }, { text: x.learnedAt, cls: 'dim' }]); })
      ));
      box.append(s6);
    }
    var gaps = docs['gaps_' + o.orgId];
    if (gaps && gaps.items && gaps.items.length) {
      var s5 = section('Not known yet');
      var ul = el('ul', 'gaps');
      gaps.items.forEach(function (g) { ul.append(el('li', '', g)); });
      s5.append(ul);
      box.append(s5);
    }
    return box;
  }

  function render(docs) {
    app.replaceChildren();
    var orgs = byPrefix(docs, 'org_').sort(function (a, b) { return String(a.firm).localeCompare(String(b.firm)); });
    if (!orgs.length) {
      app.append(el('div', 'empty', "No firm model saved yet. Ask Claude to read this firm's Filevine setup and save it here, and the project types, phases and sections will appear on this page."));
      return;
    }
    orgs.forEach(function (o) { app.append(renderOrg(o, docs)); });
  }

  function boot() {
    if (!window.claude || !window.claude.use) return;
    window.claude.use('db').then(function (db) {
      if (!db) return;
      db.collection('model').onSnapshot(function (snap) {
        var docs = {};
        snap.docs.forEach(function (x) { docs[x.id] = x.data(); });
        render(docs);
      }, function () {});
    }, function () {});
  }
  boot();
})();
</script>
